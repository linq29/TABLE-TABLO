<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年度 時間割表</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <main class="sheet">
    <header class="sheet-header">
      <p><span class="sheet-title">2026年度 時間割表</span></p>
      <p><span class="sheet-meta">担任：タカヒロ・ショウコ</span></p>
    </header>

    <div class="timetable-switch">
      <span class="switch-label">IH</span>
      <label class="switch-control">
        <input type="checkbox" id="timetable-toggle" aria-label="IHとPIを切り替え">
        <span class="switch-track"></span>
      </label>
      <span class="switch-label">PI</span>
    </div>

    <table class="timetable">
      <thead>
        <tr id="timetable-head"></tr>
      </thead>
      <tbody id="timetable-body"></tbody>
    </table>

    <section class="notes" aria-labelledby="notes-heading">
      <h2 id="notes-heading">【備考欄】</h2>
      <ul>
        <li><span class="note-code">CS3F</span><span class="note-text">ID：482 207 810 117 60</span><span
            class="note-pwd">PW：iU9c7NT3</span></li>
        <li><span class="note-code">CS3A</span><span class="note-text">ID：465 771 011 699 94</span><span
            class="note-pwd">PW：Qi75Tj9i</span></li>
        <li><span class="note-code">CS3N</span><span class="note-text">ID：467 770 143 942 32</span><span
            class="note-pwd">PW：wb3D3EA6</span></li>
      </ul>
    </section>
  </main>
  <footer>
  <img src="favicon.png" alt="Icon by Icogenix">
  <p>Icon created by <strong><a href="https://thenounproject.com/creator/asmahameed743/" target="_blank">Icogenix</a></strong> from <strong><a href="https://thenounproject.com/" target="_blank">Noun Project</a></strong>.</p>
  </footer>
  <script src="main.js" defer></script>
</body>

</html>
